name: Android Package

on:
  push:
    branches:
      - lx-music-mobile
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build arm64-v8a APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup

      - name: Get package version
        shell: bash
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"

      - name: Build release package
        env:
          DISABLE_SVG: 1
        shell: bash
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a -PuniversalApk=false

      - name: Generate checksums
        shell: bash
        run: |
          cd android/app/build/outputs/apk/release
          sha256sum lx-music-mobile-v${PACKAGE_VERSION}-arm64-v8a.apk > SHA256SUMS.txt
          ls -lh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: lx-music-mobile-arm64-v8a-v${{ env.PACKAGE_VERSION }}-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/release/lx-music-mobile-v${{ env.PACKAGE_VERSION }}-arm64-v8a.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
